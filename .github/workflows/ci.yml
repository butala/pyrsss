name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Byte-compile (SyntaxWarning as error)
        run: python -W error::SyntaxWarning -m compileall -q pyrsss
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Import smoke test (core modules)
        run: |
          python - <<'EOF'
          import importlib, pkgutil, sys
          import pyrsss
          ok = 0
          for mod in sorted({m.name for m in pkgutil.walk_packages(pyrsss.__path__, 'pyrsss.')}):
              try:
                  importlib.import_module(mod)
                  ok += 1
              except Exception as e:
                  # optional dependencies and the gnsstk extension are allowed
                  # to be missing; anything else fails the build
                  if not isinstance(e, ImportError) and 'GNSSTK' not in str(e):
                      raise
          print(f'{ok} modules imported cleanly')
          EOF
