[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrsss"
version = "0.3"
description = "Remote sensing and space science python tools."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Mark D. Butala, Matthew A. Grawe, et al.", email = "butala@illinois.edu"},
]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib",
    "netCDF4",
    "numpy",
    "pandas",
    "portion",
    "pyfftw",
    "pyproj",
    "python-dateutil",
    "scipy",
    "sh",
    "sympy",
    "tables",
    "tqdm",
]

[project.optional-dependencies]
# Domain-specific and specialized dependencies that are only needed by
# parts of the package (and are not always trivial to install):
mag = ["apexpy", "igrf", "spaceweather"]        # pyrsss.mag, pyrsss.usarray.mag2geo
iri = ["iri2016"]                               # pyrsss.iri
emtf = ["geomagio", "cartopy"]                  # pyrsss.emtf, pyrsss.util.plot
usarray = ["obspy"]                             # pyrsss.usarray.iris
hdf = ["pyhdf"]                                # pyrsss.l1.hdf4to5
dev = ["pytest", "pytest-cov"]
full = ["apexpy", "igrf", "spaceweather", "iri2016", "geomagio", "cartopy", "obspy", "pyhdf"]

[project.scripts]
pyrsss-emtf-calc-e = "pyrsss.emtf.calc_e:main"
pyrsss-emtf-calc-e-3d = "pyrsss.emtf.calc_e_3d:main"
pyrsss-emtf-e2hdf = "pyrsss.emtf.e2hdf:main"
pyrsss-emtf-e3d2hdf = "pyrsss.emtf.e3d2hdf:main"
pyrsss-gnss-bias = "pyrsss.gnss.bias:main"
pyrsss-gnss-iri-stec = "pyrsss.gnss.iri_stec:main"
pyrsss-gnss-level = "pyrsss.gnss.level:main"
pyrsss-gnss-phase-edit = "pyrsss.gnss.phase_edit:main"
pyrsss-gnss-preprocess = "pyrsss.gnss.preprocess:main"
pyrsss-gnss-process = "pyrsss.gnss.process:main"
pyrsss-gnss-rinex = "pyrsss.gnss.rinex:main"
pyrsss-kalman-validate = "pyrsss.kalman.validate:main"
pyrsss-l1-hdf4to5 = "pyrsss.l1.hdf4to5:main"
pyrsss-mag-fgm2hdf = "pyrsss.mag.fgm2hdf:main"
pyrsss-mag-fgm2iaga = "pyrsss.mag.fgm2iaga:main"
pyrsss-mag-iaga2002 = "pyrsss.mag.iaga2002:main"
pyrsss-mag-iaga2hdf = "pyrsss.mag.iaga2hdf:main"
pyrsss-mag-intermagnet-level0 = "pyrsss.mag.intermagnet_level0:main"
pyrsss-mag-process-hdf = "pyrsss.mag.process_hdf:main"
pyrsss-mag-sm2hdf = "pyrsss.mag.sm2hdf:main"
pyrsss-mag-sm2iaga = "pyrsss.mag.sm2iaga:main"
pyrsss-stats-stats = "pyrsss.stats.stats:main"
pyrsss-usarray-emtf-mirror = "pyrsss.usarray_emtf.mirror:main"
pyrsss-usarray-iris = "pyrsss.usarray.iris:main"
pyrsss-usarray-mag2geo = "pyrsss.usarray.mag2geo:main"
pyrsss-usarray-mirror-mt = "pyrsss.usarray.mirror_mt:main"
pyrsss-usarray-preprocess = "pyrsss.usarray.preprocess:main"
pyrsss-util-plot-indices = "pyrsss.util.plot_indices:main"

[project.urls]
Repository = "https://github.com/butala/pyrsss"

[tool.setuptools.packages.find]
include = ["pyrsss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
